<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Speed test</title>
  <style>
    form { max-width: 32em; }
    fieldset { min-width: 0; }
    #auto-settings label { display: inline-block; }
    #results { margin-bottom: 1em; }
    #results p { margin: 0.5em 0; }
    input[type="number"] { width: 5em; }
    th, td { padding: 0.25em; text-align: left; }
  </style>
</head>
<body>
  <h1>Speed test</h1>
  <form id="test-form">
    <p><button id="start" type="submit">Start</button> <output id="status" aria-label="Status" aria-live="polite">Ready</output></p>
    <section id="results" aria-label="Results">
      <p><strong>Latency</strong> <output id="latency">—</output> ms</p>
      <p><strong>Download</strong> <output id="download">—</output> Mbps (<output id="download-connections" aria-label="Download connections">—</output>)</p>
      <p><strong>Upload</strong> <output id="upload">—</output> Mbps (<output id="upload-connections" aria-label="Upload connections">—</output>)</p>
    </section>
    <fieldset id="settings">
      <legend>Settings</legend>
      <p>
        <label for="mode">Mode</label>
        <select id="mode">
          <option value="auto">Auto</option>
          <option value="single">Single connection</option>
        </select>
      </p>
      <fieldset id="auto-settings">
        <legend>Auto connections (1–6)</legend>
        <label for="min-connections">Min
          <input id="min-connections" type="number" min="1" max="6" step="1" value="2" required>
        </label>
        <label for="max-connections">Max
          <input id="max-connections" type="number" min="1" max="6" step="1" value="4" required>
        </label>
      </fieldset>
      <table>
        <thead>
          <tr><th scope="col">Test</th><th scope="col">Warm-up (s)</th><th scope="col">Duration (s)</th></tr>
        </thead>
        <tbody>
          <tr>
            <th scope="row">Download</th>
            <td><input id="download-warmup" aria-label="Download warm-up (seconds)" type="number" min="0" max="3600" step="0.1" value="6" required></td>
            <td><input id="download-duration" aria-label="Download duration (seconds)" type="number" min="0.1" max="3600" step="0.1" value="4" required></td>
          </tr>
          <tr>
            <th scope="row">Upload</th>
            <td><input id="upload-warmup" aria-label="Upload warm-up (seconds)" type="number" min="0" max="3600" step="0.1" value="6" required></td>
            <td><input id="upload-duration" aria-label="Upload duration (seconds)" type="number" min="0.1" max="3600" step="0.1" value="4" required></td>
          </tr>
        </tbody>
      </table>
      <p>Warm-up excluded from results.</p>
    </fieldset>
  </form>

  <script>
    const SAMPLE_INTERVAL = 250;
    const MINIMUM_GAIN = 0.08;
    const $ = selector => document.querySelector(selector);
    const form = $("#test-form");
    const settings = $("#settings");
    const autoSettings = $("#auto-settings");
    const button = $("#start");
    const mode = $("#mode");
    const minConnections = $("#min-connections");
    const maxConnections = $("#max-connections");
    const latencyOutput = $("#latency");
    const statusOutput = $("#status");

    const rate = (bytes, milliseconds) => bytes * 8 / milliseconds / 1000;
    const show = (output, value) => { output.value = value.toFixed(1); };
    const connectionLabel = count => `${count} connection${count === 1 ? "" : "s"}`;
    let requestNumber = 0;
    const endpoint = path => `${path}?_=${Date.now()}-${requestNumber++}`;

    function updateSettings() {
      autoSettings.disabled = mode.value === "single";
      maxConnections.min = minConnections.value;
    }

    mode.addEventListener("change", updateSettings);
    minConnections.addEventListener("input", updateSettings);
    updateSettings();

    function readConfig() {
      const milliseconds = id => $(`#${id}`).valueAsNumber * 1000;
      const timing = direction => ({
        warmup: milliseconds(`${direction}-warmup`),
        duration: milliseconds(`${direction}-duration`),
      });
      return {
        mode: mode.value,
        minConnections: minConnections.valueAsNumber,
        maxConnections: maxConnections.valueAsNumber,
        download: timing("download"),
        upload: timing("upload"),
      };
    }

    function median(values) {
      if (!values.length) return 0;
      values.sort((a, b) => a - b);
      const middle = values.length / 2;
      return (values[Math.floor(middle)] + values[Math.ceil(middle) - 1]) / 2;
    }

    function sampleMedian(samples, start, end) {
      return median(samples
        .filter(sample => sample.elapsed >= start && sample.elapsed <= end)
        .map(sample => sample.mbps));
    }

    async function ping() {
      const started = performance.now();
      const response = await fetch(endpoint("./ping"), { cache: "no-store" });
      if (!response.ok) throw new Error("Ping failed");
      return performance.now() - started;
    }

    async function testLatency() {
      await ping();
      const samples = [];
      for (let i = 0; i < 5; i++) {
        const sample = await ping();
        samples.push(sample);
        show(latencyOutput, sample);
      }
      show(latencyOutput, median(samples));
    }

    function managedWorker(run, cancel, fail) {
      let stopped = false;
      const done = run(() => stopped).catch(error => {
        if (!stopped && error.name !== "AbortError") fail(error);
      });

      return {
        done,
        stop() {
          if (stopped) return;
          stopped = true;
          cancel();
        },
      };
    }

    function downloadWorker(addBytes, fail) {
      const controller = new AbortController();
      return managedWorker(async stopped => {
        const response = await fetch(endpoint("./download"), {
          cache: "no-store",
          signal: controller.signal,
        });
        if (!response.ok || !response.body) throw new Error("Download failed");
        const reader = response.body.getReader();
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          addBytes(value.length);
        }
        if (!stopped()) throw new Error("Download ended early");
      }, () => controller.abort(), fail);
    }

    function uploadWorker(body, addBytes, fail) {
      let activeRequest;
      return managedWorker(async stopped => {
        while (!stopped()) await new Promise((resolve, reject) => {
          const request = new XMLHttpRequest();
          let sent = 0;
          let settled = false;
          activeRequest = request;
          request.open("POST", endpoint("./upload"));

          request.upload.onprogress = request.upload.onload = event => {
            addBytes(event.loaded - sent);
            sent = event.loaded;
          };
          const finish = error => {
            if (settled) return;
            settled = true;
            if (activeRequest === request) activeRequest = undefined;
            (error ? reject : resolve)(error);
          };
          request.onload = () => finish(
            request.status === 204 ? null : new Error("Upload failed"),
          );
          request.onerror = () => finish(
            stopped() ? null : new Error("Upload failed"),
          );
          request.onabort = () => finish();
          request.send(body);
        });
      }, () => activeRequest?.abort(), fail);
    }

    async function throughputPass(name, output, connectionsOutput, config, timing, createWorker) {
      const started = performance.now();
      const probeStart = timing.warmup / 3;
      const probeEnd = probeStart * 2;
      const activeWorkers = new Set();
      const allWorkers = [];
      const samples = [];
      let bytes = 0;
      let rejectFailure;
      let lastSampledAt = started;
      let lastSampledBytes = 0;
      let sampleTimer;
      const failure = new Promise((_, reject) => { rejectFailure = reject; });

      function stopWorkers(workers) {
        for (const worker of workers) {
          worker.stop();
          activeWorkers.delete(worker);
        }
      }

      function fail(error) {
        stopWorkers(activeWorkers);
        rejectFailure(error);
      }

      function addWorkers(count) {
        return Array.from({ length: count }, () => {
          const worker = createWorker(
            amount => { bytes += amount; },
            fail,
          );
          activeWorkers.add(worker);
          allWorkers.push(worker);
          return worker;
        });
      }

      function sample() {
        const now = performance.now();
        if (now <= lastSampledAt) return;
        const mbps = rate(bytes - lastSampledBytes, now - lastSampledAt);
        samples.push({ elapsed: now - started, mbps });
        lastSampledAt = now;
        lastSampledBytes = bytes;
        show(output, median(samples.slice(-4).map(item => item.mbps)));
      }

      function waitUntil(deadline) {
        let timer;
        const timeout = new Promise(resolve => {
          timer = setTimeout(resolve, Math.max(0, deadline - performance.now()));
        });
        return Promise.race([timeout, failure]).finally(() => clearTimeout(timer));
      }

      const initialConnections = config.mode === "single" ? 1 : config.minConnections;
      let selectedConnections = initialConnections;

      statusOutput.value = `${name}${timing.warmup ? " warm-up" : ""}…`;
      connectionsOutput.value = connectionLabel(initialConnections);

      try {
        addWorkers(initialConnections);
        sampleTimer = setInterval(sample, SAMPLE_INTERVAL);
        if (timing.warmup > 0
          && config.mode === "auto"
          && config.maxConnections > initialConnections
        ) {
          await waitUntil(started + probeStart);
          sample();
          const baseline = sampleMedian(samples, probeStart / 2, probeStart);
          const added = addWorkers(config.maxConnections - initialConnections);
          connectionsOutput.value = `probing ${config.maxConnections}`;

          await waitUntil(started + probeEnd);
          sample();
          const expanded = sampleMedian(
            samples,
            probeEnd - (probeStart / 2),
            probeEnd,
          );
          if (baseline > 0 && expanded >= baseline * (1 + MINIMUM_GAIN)) {
            selectedConnections = config.maxConnections;
          } else {
            stopWorkers(added);
          }
          connectionsOutput.value = connectionLabel(selectedConnections);
        }

        if (timing.warmup) await waitUntil(started + timing.warmup);
        statusOutput.value = `${name}…`;
        const scoreStarted = performance.now();
        const scoreBytes = bytes;
        samples.length = 0;
        lastSampledAt = scoreStarted;
        lastSampledBytes = scoreBytes;
        output.value = "—";
        await waitUntil(scoreStarted + timing.duration);
        const scoreEnded = performance.now();
        const measuredBytes = bytes - scoreBytes;
        if (measuredBytes <= 0) throw new Error(`${name} transferred no data`);
        const result = rate(measuredBytes, scoreEnded - scoreStarted);
        show(output, result);
        return { connections: selectedConnections, mbps: result };
      } finally {
        clearInterval(sampleTimer);
        stopWorkers(activeWorkers);
        await Promise.allSettled(allWorkers.map(worker => worker.done));
      }
    }

    function runPass(name, config, createWorker) {
      const key = name.toLowerCase();
      return throughputPass(
        name,
        $(`#${key}`),
        $(`#${key}-connections`),
        config,
        config[key],
        createWorker,
      );
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();
      if (button.disabled) return;
      const config = readConfig();
      button.disabled = settings.disabled = true;
      for (const output of document.querySelectorAll("#results output")) output.value = "—";
      statusOutput.value = "Latency…";
      try {
        await testLatency();
        await runPass("Download", config, downloadWorker);

        const body = new Blob([new Uint8Array(32 * 1024 * 1024)]);
        await runPass("Upload", config, (addBytes, fail) => uploadWorker(body, addBytes, fail));
        statusOutput.value = "Done";
      } catch (error) {
        statusOutput.value = "Failed";
        alert(error.message || "Test failed");
      } finally {
        button.disabled = settings.disabled = false;
      }
    });
  </script>
</body>
</html>
